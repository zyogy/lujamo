title: Luja Digital – appar och programvara
description: Apputveckling, idéutveckling, bollplank och konsultation samt planering, ledning och genomförande av projekt utifrån verkliga behov.
summary: Apputveckling, idéutveckling, bollplank och konsultation samt planering, ledning och genomförande av projekt utifrån verkliga behov.
