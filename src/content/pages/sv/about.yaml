title: Lujamos historia – Lujamo
description: Lujamo är ett litet finländskt familjeföretag. Vi utvecklar människocentrerade appar och hjälper till från idé till lansering och vidareutveckling.
eyebrow: Om företaget
heading: Hållbara appar för verkliga behov.
lead: Lujamo är ett litet finländskt familjeföretag med apputveckling som kärnkompetens. Vi planerar och utvecklar människocentrerade appar och digitala lösningar som utgår från verkliga behov och ger användarna praktisk nytta.
story:
  eyebrow: Lujamos historia
  heading: En plats där idéer blir fungerande appar.
  body: |-
    Bakom Lujamo finns tanken att god apputveckling börjar med att lyssna. Människors erfarenheter, vardagens utmaningar och även små iakttagelser kan vara början till en app som är till nytta för många.

    Vi vill bygga ett företag där vi kan ta vara på dessa tankar: ställa frågor, prova, lära oss och föra saker framåt. Ibland behövs en helt ny app, ibland behöver en befintlig lösning utvecklas och ibland behövs någon som hjälper till att strukturera idén och föra projektet vidare.

    Apputveckling är kärnan i Lujamo, men ett bra resultat bygger ofta också på idéarbete, planering, samarbete och ett omsorgsfullt genomförande. Därför vill vi vara med längs hela utvecklingsvägen efter behov.

    I namnet Lujamo står ”luja” för tillförlitlighet, hållbarhet och omsorgsfullt arbete. ”Mo” för tankarna till en plats där man skapar och bygger. För oss är Lujamo en plats där behov blir idéer och idéer blir fungerande appar och lösningar.

    Som ett litet familjeföretag vill vi arbeta nära människor och hålla samarbetet okomplicerat. För oss är en hållbar app en app med ett tydligt syfte, som ger praktisk nytta och kan utvecklas i takt med användarnas erfarenheter.
values:
  heading: Vad vi strävar efter
  items:
    - title: Hållbarhet
      text: Vi bygger lösningar som fungerar också om flera år. Vi väljer det enkla sättet när det räcker.
    - title: Flexibilitet
      text: Vi anpassar arbetet efter kundens behov och byter riktning när vi lär oss något nytt.
    - title: Förtroende
      text: Vi säger rakt ut vad vi gör, vad det kostar och när det är klart.
detailsHeading: Företagsuppgifter
body: |-
  Utöver apputveckling erbjuder vi idéutveckling, bollplank och konsultation samt planering, ledning och genomförande av projekt. Vi kan hjälpa till i olika skeden av utvecklingsarbetet, från att förtydliga den första idén till att lansera en fungerande app och utveckla den vidare.

  Vi utvecklar också egna produkter, till exempel ValmiusTurva, en app för säkerhet och beredskap.

  Utgångspunkten för vårt arbete är människor och deras verkliga behov. Vi vill förstå vad som kunde underlätta vardagen eller verksamheten och vilken app eller annan digital lösning som skulle vara till nytta. Vi är särskilt intresserade av samhällsviktiga frågor, men är också öppna för nya idéer, branscher och försök.

  Samarbetet kan börja med ett samtal, med att förtydliga en idé eller med att planera ett helt appprojekt. Vi går framåt utifrån behoven och de mål vi kommer överens om tillsammans.
