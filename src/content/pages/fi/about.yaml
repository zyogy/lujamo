title: Lujamon tarina – Lujamo
description: Lujamo on pieni suomalainen perheyritys. Kehitämme ihmislähtöisiä sovelluksia ja autamme ideoinnista julkaisuun ja jatkokehitykseen.
eyebrow: Yrityksen esittely
heading: Lujia sovelluksia todellisiin tarpeisiin.
lead: Lujamo on pieni suomalainen perheyritys, jonka ydinosaamista on sovelluskehitys. Suunnittelemme ja toteutamme ihmislähtöisiä sovelluksia ja digitaalisia ratkaisuja, jotka perustuvat todellisiin tarpeisiin ja tuovat käytännön hyötyä käyttäjilleen.
story:
  eyebrow: Lujamon tarina
  heading: Paikka, jossa ideat muuttuvat toimiviksi sovelluksiksi.
  body: |-
    Lujamon taustalla on ajatus siitä, että hyvä sovelluskehitys alkaa kuuntelemisesta. Ihmisten kokemuksissa, arjen haasteissa ja pienissäkin havainnoissa voi olla alku sovellukselle, josta on hyötyä monelle.

    Haluamme rakentaa yritystä, jossa näihin ajatuksiin voidaan tarttua: kysyä, kokeilla, oppia ja viedä asioita eteenpäin. Joskus tarvitaan kokonaan uusi sovellus, joskus olemassa olevan ratkaisun kehittämistä ja joskus rinnalle ihminen, joka auttaa jäsentämään idean ja viemään projektia eteenpäin.

    Sovelluskehitys on Lujamon ydin, mutta hyvä lopputulos syntyy usein myös ideoinnista, suunnittelusta, yhteistyöstä ja projektin huolellisesta toteutuksesta. Siksi haluamme olla mukana koko kehityspolulla tarpeen mukaan.

    Lujamo-nimessä ”luja” kuvaa luotettavuutta, kestävyyttä ja huolellista tekemistä. ”Mo” tuo mieleen paikan, jossa tehdään ja rakennetaan. Meille Lujamo on paikka, jossa tarpeista syntyy ideoita ja ideoista toimivia sovelluksia ja ratkaisuja.

    Pienenä perheyrityksenä haluamme toimia ihmisläheisesti ja pitää yhteistyön mutkattomana. Meille luja sovellus on sellainen, jolla on selkeä tarkoitus, josta on käytännön hyötyä ja jota voidaan kehittää käyttäjien kokemusten karttuessa.
values:
  heading: Mihin pyrimme
  items:
    - title: Kestävyyttä
      text: Teemme ratkaisuja, jotka toimivat vielä vuosien päästä. Valitsemme yksinkertaisen tavan, kun se riittää.
    - title: Joustavuutta
      text: Sovitamme työn asiakkaan tarpeeseen ja muutamme suuntaa, kun opimme jotain uutta.
    - title: Luottamusta
      text: Kerromme suoraan, mitä teemme, mitä se maksaa ja milloin se on valmis.
detailsHeading: Yritystiedot
body: |-
  Sovelluskehityksen lisäksi tarjoamme ideointia, sparrausta ja konsultointia sekä projektien suunnittelua, vetämistä ja toteutusta. Voimme auttaa kehitystyön eri vaiheissa aina ensimmäisen idean kirkastamisesta toimivan sovelluksen julkaisuun ja jatkokehitykseen asti.

  Kehitämme myös omia tuotteita, kuten turvallisuuteen ja varautumiseen suunnattua ValmiusTurva-sovellusta.

  Työmme lähtökohtana ovat ihmiset ja heidän todelliset tarpeensa. Haluamme ymmärtää, mitä arjessa tai toiminnassa voisi helpottaa ja millainen sovellus tai muu digitaalinen ratkaisu toisi siihen hyötyä. Meitä kiinnostavat erityisesti yhteiskunnallisesti tärkeät aiheet, mutta olemme avoimia myös erilaisille uusille ideoille, toimialoille ja kokeiluille.

  Yhteistyö voi alkaa yhdestä keskustelusta, idean kirkastamisesta tai kokonaisen sovellusprojektin suunnittelusta. Etenemme tarpeen ja yhdessä sovittujen tavoitteiden mukaan.
